<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Item - CBIT Lost & Found</title>

  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <header class="main-header">

    <div class="logo-section">
      <img src="images/logo.png" alt="CBIT Logo">
    </div>

    <div class="title-section">
      <h1>Post Item</h1>
      <p>CBIT Lost & Found</p>
    </div>

    <a href="index.html" class="back-btn">← Home</a>

  </header>


  <div id="loadingMsg" style="text-align: center; margin-top: 50px;">
    <p>Checking authentication...</p>
  </div>


  <section class="form-section" id="postFormContainer" style="display: none;">

    <form id="postForm">

      <input 
        type="text" 
        id="title" 
        placeholder="Item Name" 
        required
      >

      <select id="category">
        <option value="">All / Not specified</option>
        <option>Electronics</option>
        <option>Documents</option>
        <option>Accessories</option>
        <option>Bags</option>
        <option>Other</option>
      </select>

      <select id="type" required>
        <option value="">Type</option>
        <option value="Lost">Lost</option>
        <option value="Found">Found</option>
      </select>

      <textarea 
        id="description" 
        placeholder="Description"
        required
      ></textarea>

      <input 
        type="text" 
        id="location" 
        placeholder="Location (e.g., Library, Block A)" 
        required
      >

      <input 
        type="datetime-local" 
        id="date" 
        required
      >

      <input 
        type="file" 
        id="images" 
        multiple 
        accept="image/*"
      >

      <p style="font-size: 12px; color: gray;">
        If FOUND item → at least one image is required <br>
        If LOST item → image is optional
      </p>

      <div id="imagePreview" class="preview-container"></div>

      <div id="securitySection" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; display: none;">
        <p style="font-size: 13px; color: #2e5e2e;"><strong>Set a Security Question (for Claimers)</strong></p>
        <p style="font-size: 11px; color: gray; margin-bottom: 5px;">This helps verify the real owner of the item.</p>
        <input type="text" id="securityQuestion" placeholder="e.g., What color is the keychain?">
        <input type="text" id="securityAnswer" placeholder="The correct answer">
      </div>

      <input 
        type="text" 
        id="username" 
        placeholder="Your Name (optional)"
      >

      <input 
        type="text" 
        id="contact" 
        placeholder="Contact (Phone / Email / Insta / Telegram)"
      >

      <button type="submit">Post Item</button>

    </form>

  </section>


  <script type="module" src="js/post.js"></script>

</body>
</html>
