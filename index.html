<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBIT Lost & Found</title>

  <!-- Styles & Meta -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="main-header">

    <div class="logo-section">
      <img src="images/logo.png" alt="CBIT Logo">
    </div>

    <div class="title-section">
      <h1>Lost & Found Portal</h1>
      <p>Chaitanya Bharathi Institute of Technology</p>
    </div>

    <a href="post.html" class="post-btn">+ Post Item</a>

  </header>

  <!-- Accent line -->
  <div class="accent-line"></div>


  <!-- ================= HERO SECTION ================= -->
  <section class="hero">
    <div class="hero-overlay">
      <h1>CBIT Lost & Found</h1>
      <p>Helping students recover lost items across campus</p>
    </div>
  </section>


  <!-- ================= SEARCH & FILTER ================= -->
  <section class="search-section">

    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search items (e.g., wallet, phone)"
    >

    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option>Electronics</option>
      <option>Documents</option>
      <option>Accessories</option>
      <option>Bags</option>
    </select>

    <select id="typeFilter">
      <option value="">All</option>
      <option value="Lost">Lost</option>
      <option value="Found">Found</option>
    </select>

    <button onclick="resetFilters()">Reset</button>

  </section>


  <!-- ================= ITEMS LIST ================= -->
  <section id="itemsContainer" class="items-container">
    <!-- Items will be dynamically inserted here -->
  </section>


  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-content">
      <h3>CBIT Lost & Found Portal</h3>
      <p>Helping students recover lost items across campus</p>
      <p class="footer-note">Developed by Saleem</p>
    </div>
  </footer>


  <!-- ================= SCRIPTS ================= -->
  <script src="js/app.js"></script>

</body>
</html>
