<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBIT Lost & Found</title>

  <!-- Styles & Meta -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="main-header">
  <div class="logo-section">
    <img src="images/logo.png" alt="CBIT Logo">
  </div>

  <div class="title-section">
    <h1>Lost & Found Portal</h1>
    <p>Chaitanya Bharathi Institute of Technology</p>
  </div>

  <div id="authSection">
    <button id="loginBtn" class="post-btn" style="background: #4285F4;">Login with Google</button>
    <div id="userProfile" style="display: none; align-items: center; gap: 15px;">
  <div id="notifBell" style="position: relative; cursor: pointer;">
    <span style="font-size: 20px;">🔔</span>
    <span id="notifCount" style="display: none; position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px;">0</span>
  </div>
  
  <img id="userAvatar" src="" style="width: 35px; border-radius: 50%;">
  <a href="post.html" class="post-btn">+ Post Item</a>
  <button id="logoutBtn" class="back-btn" style="background: #555;">Logout</button>
</div>
  </div>
</header>

  <!-- Accent line -->
  <div class="accent-line"></div>


  <!-- ================= HERO SECTION ================= -->
  <section class="hero">
    <div class="hero-overlay">
      <h1>CBIT Lost & Found</h1>
      <p>Helping students recover lost items across campus</p>
    </div>
  </section>


  <!-- ================= SEARCH & FILTER ================= -->
  <section class="search-section">

    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search items (e.g., wallet, phone)"
    >

    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option>Electronics</option>
      <option>Documents</option>
      <option>Accessories</option>
      <option>Bags</option>
    </select>

    <select id="typeFilter">
      <option value="">All</option>
      <option value="Lost">Lost</option>
      <option value="Found">Found</option>
    </select>

    <button onclick="resetFilters()">Reset</button>

  </section>


  <!-- ================= ITEMS LIST ================= -->
  <section id="itemsContainer" class="items-container">
    <!-- Items will be dynamically inserted here -->
  </section>


  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-content">
      <h3>CBIT Lost & Found Portal</h3>
      <p>Helping students recover lost items across campus</p>
      <p class="footer-note">Developed by Saleem</p>
    </div>
  </footer>


  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
