<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat - CBIT Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="main-header">
    <div class="logo-section">
      <img src="images/logo.png" alt="CBIT Logo">
    </div>
    <div class="title-section">
      <h1 id="chatHeaderTitle">Chat Room</h1>
      <p>Secure Campus Messaging</p>
    </div>
    <a href="notifications.html" class="back-btn">← Back</a>
  </header>

  <div class="accent-line"></div>

  <section class="details-container">
    <div class="details-box" style="display: flex; flex-direction: column; height: 70vh;">
      <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px;">
        <p style="text-align: center; color: gray;">Loading conversation...</p>
      </div>

      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <input type="text" id="messageInput" placeholder="Type a safe message..." style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none;">
        <button id="sendBtn" class="recover-btn" style="width: auto; padding: 0 25px; border-radius: 25px;">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </section>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
