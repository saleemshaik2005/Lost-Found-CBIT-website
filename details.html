<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Item Details - CBIT Lost & Found</title>

  <!-- Styles & Meta -->
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="main-header">

    <div class="logo-section">
      <img src="images/logo.png" alt="CBIT Logo">
    </div>

    <div class="title-section">
      <h1>Item Details</h1>
      <p>CBIT Lost & Found</p>
    </div>

    <a href="index.html" class="back-btn">← Home</a>

  </header>


  <!-- ================= DETAILS CONTENT ================= -->
  <section id="detailsContainer" class="details-container">
    <!-- Item details will be loaded here -->
  </section>


  <!-- ================= IMAGE MODAL ================= -->
  <div id="imageModal" class="image-modal" onclick="closeImage()">
    <img id="modalImg" alt="Full View">
  </div>


  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-content">
      <h3>CBIT Lost & Found Portal</h3>
      <p>Helping students recover lost items across campus</p>
      <p class="footer-note">Developed by Saleem</p>
    </div>
  </footer>


  <!-- ================= SCRIPTS ================= -->
  <script src="js/details.js"></script>

</body>
</html>
